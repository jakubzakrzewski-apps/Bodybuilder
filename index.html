<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Bodybuilder</title>
  <meta name="apple-mobile-web-app-title" content="Bodybuilder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
  </div>
  <div id="rest" hidden></div>
  <div id="live" hidden></div>
  <nav id="nav">
    <button data-act="tab" data-tab="workout">
      <svg viewBox="0 0 24 24"><path d="M3 9v6M6.5 6v12M17.5 6v12M21 9v6M6.5 12h11"/></svg>
      <span>Trening</span>
    </button>
    <button data-act="tab" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/></svg>
      <span>Historia</span>
    </button>
    <button data-act="tab" data-tab="exercises">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Ćwiczenia</span>
    </button>
  </nav>
  <div id="sheet" hidden></div>
  <input type="file" id="import-file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
